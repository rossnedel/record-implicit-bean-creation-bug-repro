plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor 'io.micronaut:micronaut-inject-java:5.2.21'
    implementation 'io.micronaut:micronaut-inject:5.2.21'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
}

application {
    mainClass = 'example.Main'
}
